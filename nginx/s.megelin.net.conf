# 退订链接专用域名：只暴露退订页和退订接口，其余路径一律 404。
# 与主域名 sendwalk.com 隔离，租户违规发信导致的投诉/拉黑不会波及主域名。
# 部署位置：/etc/nginx/conf.d/s.megelin.net.conf
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name s.megelin.net;

    ssl_certificate     /data/www/ca/s.megelin.net.pem;
    ssl_certificate_key /data/www/ca/s.megelin.net.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /data/www/sendwalk/frontend/dist;
    charset utf-8;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    access_log /var/log/nginx/s.megelin.net-access.log;
    error_log  /var/log/nginx/s.megelin.net-error.log;

    # 邮件中的退订链接：GET 显示退订确认页（前端 SPA），POST 为 RFC 8058 一键退订（交给 Laravel）
    location = /unsubscribe {
        error_page 418 = @laravel;
        if ($request_method = POST) {
            return 418;
        }
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files /index.html =404;
    }

    # 退订页调用的接口（同源，无需跨域）
    location = /api/unsubscribe {
        error_page 418 = @laravel;
        return 418;
    }

    # 退订页需要的前端静态资源
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }
    location ~ ^/favicon[^/]*$ {
        access_log off;
        try_files $uri =404;
    }

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location / {
        return 404;
    }

    location @laravel {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /data/www/sendwalk/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name s.megelin.net;
    return 301 https://$host$request_uri;
}
